# Wraps migrated image files in image media entities. Alt falls back from
# the harvested caption to the parent page title to the filename.
id: pe_legacy_media_images
label: 'Legacy media (images)'
migration_tags:
  - pe_legacy
source:
  plugin: pe_wayback_items
  row_mode: media
  media_kinds:
    - image
process:
  _label:
    -
      plugin: null_coalesce
      source:
        - caption
        - parent_title
        - filename
    -
      plugin: default_value
      default_value: 'Untitled legacy image'
  name:
    plugin: substr
    source: '@_label'
    start: 0
    length: 255
  field_media_image/target_id:
    plugin: migration_lookup
    migration: pe_legacy_files
    source: sha256
    no_stub: true
  field_media_image/alt:
    plugin: substr
    source: '@_label'
    start: 0
    length: 512
  uid:
    plugin: default_value
    default_value: 1
  status:
    plugin: default_value
    default_value: 1
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: 'entity:media'
  default_bundle: image
migration_dependencies:
  required:
    - pe_legacy_files
