# Built by Vite from src/ - run `npm run build` in the theme directory.
# dist/ is committed: it is the production transport (the deploy bind-mounts
# the theme directory; there is no node toolchain on the server).
global:
  css:
    theme:
      dist/main.css: { preprocess: false }
  js:
    # type=module: the bundle code-splits (gallery lightbox loads as a
    # dynamic chunk), and Vite's chunk loader resolves URLs via
    # import.meta - only legal in a module script. Modules defer natively.
    dist/main.js: { preprocess: false, attributes: { type: module } }
