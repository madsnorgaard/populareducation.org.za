; Custom PHP settings layered on the drupal:11-php8.4-apache base.
; drush cim and image derivative generation need more than the stock 128 MB.
memory_limit = 512M

; Headroom for high-resolution master uploads (the archive is the point).
upload_max_filesize = 256M
post_max_size = 256M

; Air for long-running requests (cron, drush cim, DZI tile generation).
max_execution_time = 180

; realpath cache helps Drupal's include-heavy bootstrap on a large vendor/.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
